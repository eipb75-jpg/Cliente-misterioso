<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliente misterioso – Ficha de visita</title>
<style>
  :root { --c: #0b5cab; --bg: #f3f5f8; --bd: #d5dbe3; --tx: #1c2430; --mu: #5b6676; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--tx); }
  header { background: var(--c); color: #fff; padding: 18px 16px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 14px; opacity: .9; }
  main { max-width: 640px; margin: 0 auto; padding: 12px; }
  section { background: #fff; border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin: 12px 0; }
  h2 { font-size: 16px; margin: 0 0 10px; color: var(--c); }
  label.f { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=date], input[type=time], select, textarea {
    width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--bd); border-radius: 8px; background: #fff; color: var(--tx);
  }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .crit { padding: 10px 0; border-top: 1px solid var(--bd); }
  .crit:first-of-type { border-top: 0; }
  .crit b { font-size: 14px; display: block; margin-bottom: 6px; }
  .scale { display: flex; gap: 6px; }
  .scale label { flex: 1; }
  .scale input { position: absolute; opacity: 0; pointer-events: none; }
  .scale span { display: block; text-align: center; padding: 10px 0; border: 1px solid var(--bd); border-radius: 8px; font-weight: 600; background: #fff; }
  .scale input:checked + span { background: var(--c); color: #fff; border-color: var(--c); }
  .scale input:focus-visible + span { outline: 3px solid #9cc4ee; }
  .hint { font-size: 12px; color: var(--mu); margin: 6px 0 0; }
  button { font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 10px; padding: 13px 16px; cursor: pointer; }
  .primary { background: var(--c); color: #fff; width: 100%; }
  .secondary { background: #e4edf8; color: var(--c); width: 100%; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--bd); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 16px; line-height: 28px; }
  #msg { margin: 10px 0; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
  #msg.ok { display: block; background: #e6f4ea; color: #1e5c30; }
  #msg.err { display: block; background: #fdecea; color: #8a1f17; }
  .actions { display: grid; gap: 10px; margin: 12px 0 30px; }
</style>
</head>
<body>
<header>
  <h1>Cliente misterioso</h1>
  <p>Ficha de visita · rellénala en el momento y añade fotos con la cámara</p>
</header>

<main>
<form id="f" novalidate>

  <section>
    <h2>Datos de la visita</h2>
    <label class="f" for="tipo">Qué vas a inspeccionar</label>
    <select id="tipo" required>
      <option value="parada">Parada</option>
      <option value="urbano">Vehículo – servicio urbano</option>
      <option value="interurbano">Vehículo – servicio interurbano</option>
    </select>
    <div class="row">
      <div><label class="f" for="fecha">Fecha</label><input type="date" id="fecha" required></div>
      <div><label class="f" for="hora">Hora</label><input type="time" id="hora" required></div>
    </div>
    <label class="f" for="evaluador">Nombre de quien evalúa</label>
    <input type="text" id="evaluador" autocomplete="name">
    <div class="row">
      <div>
        <label class="f" for="zona">Zona</label>
        <select id="zona" required>
          <option value="">Elegir…</option>
          <option>Torrevieja</option>
          <option>Benidorm</option>
          <option>Otra</option>
        </select>
      </div>
      <div id="boxServicio">
        <label class="f" for="servicio">Servicio</label>
        <select id="servicio" required>
          <option value="">Elegir…</option>
          <option>Urbano</option>
          <option>Interurbano</option>
        </select>
      </div>
    </div>
    <div class="row" id="rowLinea">
      <div><label class="f" for="linea">Línea</label><input type="text" id="linea" placeholder="Ej. L1"></div>
      <div><label class="f" for="vehiculo">Vehículo (nº / matrícula)</label><input type="text" id="vehiculo"></div>
    </div>
    <label class="f" for="parada" id="lblParada">Parada o lugar de la visita</label>
    <input type="text" id="parada">
  </section>

  <section>
    <h2>Valoración</h2>
    <p class="hint" style="margin-top:0">1 = muy mal · 5 = muy bien · N/A = no aplica o no se pudo valorar.</p>
    <div id="criterios"></div>
  </section>

  <section>
    <h2>Observaciones</h2>
    <label class="f" for="obs">Qué has visto (lo bueno y lo mejorable)</label>
    <textarea id="obs"></textarea>
  </section>

  <section>
    <h2>Fotos</h2>
    <button type="button" class="secondary" id="btnFoto">📷 Hacer una foto</button>
    <input type="file" id="inpFoto" accept="image/*" capture="environment" hidden>
    <p class="hint">Cada vez que pulses se abre la cámara. Puedes añadir todas las fotos que necesites.</p>
    <div class="photos" id="fotos"></div>
  </section>

  <div id="msg" role="status"></div>
  <div class="actions">
    <button type="button" class="primary" id="btnEnviar">Enviar ficha</button>
    <button type="button" class="secondary" id="btnNueva">Empezar una ficha nueva</button>
  </div>
</form>
</main>

<script>
(function () {
  // ===== CONFIGURACIÓN (cambia lo que necesites) =====
  var EMAIL_DESTINO = "";   // Ej.: "calidad@tuempresa.es". Vacío = lo eliges al compartir.
  var ASUNTO = "Cliente misterioso – ficha de visita";
  // Criterios de cada tipo de inspección (basados en las áreas de la norma UNE-EN 13816).
  // Para cambiarlos: edita, añade o borra líneas de cada lista.
  var CUESTIONARIOS = {
    parada: [
      "Estado y limpieza de la parada / marquesina",
      "Señalización de la parada (poste, línea, nombre)",
      "Información de líneas y horarios actualizada",
      "Información sobre tarifas y cómo pagar",
      "Accesibilidad (acera, rebaje, espacio para silla de ruedas)",
      "Iluminación y sensación de seguridad",
      "Bancos y protección frente a sol y lluvia",
      "Papelera y ausencia de desperfectos o pintadas"
    ],
    urbano: [
      "Puntualidad del servicio",
      "Limpieza interior del vehículo",
      "Limpieza exterior del vehículo",
      "Trato y amabilidad del conductor",
      "Uniformidad y aspecto del conductor",
      "Información en el vehículo (línea, destino, próxima parada)",
      "Funcionamiento de validadores y pago",
      "Accesibilidad (rampa, espacio PMR, avisos)",
      "Climatización y comodidad",
      "Conducción (suavidad y seguridad)"
    ],
    interurbano: [
      "Puntualidad de salida y llegada",
      "Limpieza interior del vehículo",
      "Limpieza exterior del vehículo",
      "Trato y amabilidad del conductor",
      "Uniformidad y aspecto del conductor",
      "Información en el vehículo (línea, destino, paradas)",
      "Validación del título / venta de billete",
      "Accesibilidad (rampa, espacio PMR, avisos)",
      "Comodidad de asientos y climatización",
      "Cinturones, salidas de emergencia y botiquín visibles",
      "Conducción (suavidad y seguridad)"
    ]
  };
  var CRITERIOS = CUESTIONARIOS.parada;
  var MAX_LADO = 1600;      // tamaño máximo de las fotos en píxeles
  // ===================================================

  var $ = function (id) { return document.getElementById(id); };
  var fotos = [];           // [{file, url}]

  // Criterios
  function pintarCriterios() {
    var cont = $("criterios");
    cont.innerHTML = "";
    CRITERIOS = CUESTIONARIOS[$("tipo").value];
    CRITERIOS.forEach(function (c, i) {
      var d = document.createElement("div");
      d.className = "crit";
      var h = '<b>' + c + '</b><div class="scale">';
      for (var n = 1; n <= 5; n++) {
        h += '<label><input type="radio" name="c' + i + '" value="' + n + '"><span>' + n + '</span></label>';
      }
      h += '<label><input type="radio" name="c' + i + '" value="N/A"><span>N/A</span></label>';
      d.innerHTML = h + '</div>';
      cont.appendChild(d);
    });
    var esParada = $("tipo").value === "parada";
    // En una parada no se pregunta por línea, vehículo ni tipo de servicio
    $("rowLinea").style.display = esParada ? "none" : "";
    $("boxServicio").style.display = esParada ? "none" : "";
    $("zona").parentNode.style.gridColumn = esParada ? "1 / -1" : "";
    $("servicio").value = esParada ? "" : ($("tipo").value === "urbano" ? "Urbano" : "Interurbano");
    $("lblParada").textContent = esParada ? "Parada (nombre, calle o número)" : "Parada o lugar de la visita";
  }
  $("tipo").addEventListener("change", pintarCriterios);
  pintarCriterios();

  function ahora() {
    var d = new Date();
    var p = function (x) { return String(x).padStart(2, "0"); };
    $("fecha").value = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    $("hora").value = p(d.getHours()) + ":" + p(d.getMinutes());
  }
  ahora();

  function aviso(txt, tipo) {
    var m = $("msg");
    m.textContent = txt;
    m.className = tipo || "";
  }

  // Fotos
  $("btnFoto").addEventListener("click", function () { $("inpFoto").click(); });
  $("inpFoto").addEventListener("change", function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    files.forEach(function (f) {
      reducir(f).then(function (blob) {
        var n = fotos.length + 1;
        var file = new File([blob], "foto-" + String(n).padStart(2, "0") + ".jpg", { type: "image/jpeg" });
        fotos.push({ file: file, url: URL.createObjectURL(file) });
        pintarFotos();
      }).catch(function () { aviso("No se pudo procesar la foto. Inténtalo de nuevo.", "err"); });
    });
  });

  function reducir(file) {
    return new Promise(function (ok, ko) {
      var img = new Image();
      var u = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, MAX_LADO / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? ok(b) : ko(); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(u); ko(); };
      img.src = u;
    });
  }

  function pintarFotos() {
    var cont = $("fotos");
    cont.innerHTML = "";
    fotos.forEach(function (f, i) {
      var d = document.createElement("div");
      d.className = "ph";
      var im = document.createElement("img");
      im.src = f.url; im.alt = "Foto " + (i + 1);
      var b = document.createElement("button");
      b.type = "button"; b.textContent = "×"; b.setAttribute("aria-label", "Quitar foto " + (i + 1));
      b.addEventListener("click", function () {
        URL.revokeObjectURL(f.url);
        fotos.splice(i, 1);
        pintarFotos();
      });
      d.appendChild(im); d.appendChild(b);
      cont.appendChild(d);
    });
  }

  // Resumen en texto
  function resumen() {
    var v = function (id) { return $(id).value.trim() || "—"; };
    var t = [];
    t.push("CLIENTE MISTERIOSO – FICHA DE VISITA");
    t.push("Inspección: " + $("tipo").options[$("tipo").selectedIndex].text);
    t.push("Fecha: " + v("fecha") + "  Hora: " + v("hora"));
    t.push("Evaluador/a: " + v("evaluador"));
    if ($("tipo").value === "parada") {
      t.push("Zona: " + v("zona"));
      t.push("Parada: " + v("parada"));
    } else {
      t.push("Zona: " + v("zona") + "  Servicio: " + v("servicio"));
      t.push("Línea: " + v("linea") + "  Vehículo: " + v("vehiculo"));
      t.push("Parada/lugar: " + v("parada"));
    }
    t.push("");
    t.push("VALORACIÓN (1-5)");
    CRITERIOS.forEach(function (c, i) {
      var r = document.querySelector('input[name="c' + i + '"]:checked');
      t.push("- " + c + ": " + (r ? r.value : "sin valorar"));
    });
    t.push("");
    t.push("OBSERVACIONES");
    t.push(v("obs"));
    t.push("");
    t.push("Fotos adjuntas: " + fotos.length);
    return t.join("\n");
  }

  function faltan() {
    var f = [];
    if (!$("zona").value) f.push("la zona");
    if ($("tipo").value !== "parada" && !$("servicio").value) f.push("el servicio");
    if ($("tipo").value === "parada" && !$("parada").value.trim()) f.push("la parada");
    return f;
  }

  function descargar(blob, nombre) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  $("btnEnviar").addEventListener("click", function () {
    var f = faltan();
    if (f.length) { aviso("Falta indicar " + f.join(" y ") + ".", "err"); return; }

    var texto = resumen();
    var archivos = fotos.map(function (x) { return x.file; });
    var sello = ($("fecha").value || "ficha") + "-" + ($("hora").value || "").replace(":", "");
    var txt = new File([texto], "ficha-" + sello + ".txt", { type: "text/plain" });
    var todos = [txt].concat(archivos);

    // 1) Compartir desde el móvil (correo, Teams, WhatsApp…) con fotos adjuntas
    if (navigator.canShare && navigator.canShare({ files: todos }) && navigator.share) {
      navigator.share({ title: ASUNTO, text: texto, files: todos })
        .then(function () { aviso("Ficha compartida. Si no has llegado a enviarla, vuelve a pulsar Enviar.", "ok"); })
        .catch(function (e) { if (e && e.name !== "AbortError") aviso("No se pudo compartir: " + e.message, "err"); });
      return;
    }

    // 2) Alternativa: descargar ficha y fotos, y abrir el correo para adjuntarlas a mano
    descargar(txt, txt.name);
    archivos.forEach(function (a, i) { setTimeout(function () { descargar(a, a.name); }, 400 * (i + 1)); });
    var cuerpo = texto + "\n\n(Adjunta las fotos descargadas.)";
    var url = "mailto:" + encodeURIComponent(EMAIL_DESTINO) + "?subject=" + encodeURIComponent(ASUNTO) + "&body=" + encodeURIComponent(cuerpo);
    setTimeout(function () { location.href = url; }, 400 * (archivos.length + 2));
    aviso("Se han descargado la ficha y las fotos. Se abrirá tu correo para que las adjuntes y envíes.", "ok");
  });

  $("btnNueva").addEventListener("click", function () {
    if (!confirm("¿Borrar esta ficha y empezar una nueva?")) return;
    $("f").reset();
    pintarCriterios();
    fotos.forEach(function (x) { URL.revokeObjectURL(x.url); });
    fotos = [];
    pintarFotos();
    ahora();
    aviso("", "");
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
